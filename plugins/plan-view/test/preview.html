<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계획 보기 미리보기</title>
<!-- 실제 DSH 없이 lib/client.js의 계획 탭과 채팅 머리 칩을 올려 보는 틀.
     ?theme=dark 어두운 테마, ?empty=1 빈 화면, ?step=0~3 진행 단계 고정, ?carried=1 새 턴(투영 비움), 단추로 실시간 재생. -->
<style>
  :root {
    --dsw-alias-label-primary: #1f1f1f; --dsw-alias-label-secondary: #5f5f5f; --dsw-alias-label-tertiary: #8a8a8a;
    --dsw-alias-state-business-primary: #3964fe; --dsw-alias-state-business-tertiary: rgba(57, 100, 254, .12);
    --dsw-alias-border-l1: rgba(0, 0, 0, .12); --dsw-alias-card-fill: #fff; --dsw-alias-card-fill-hover: #f2f3f5;
    --dsw-focus-ring-color: #3964fe; --dsw-focus-ring-width: 2px; --dsw-radius-lg: 12px; --dsw-radius-sm: 6px;
    --dsw-specific-menu: #fff; --page: #fafafa; color-scheme: light;
  }
  :root[data-theme='dark'] {
    --dsw-alias-label-primary: #ececec; --dsw-alias-label-secondary: #b4b4b4; --dsw-alias-label-tertiary: #8d8d8d;
    --dsw-alias-state-business-primary: #7b9bff; --dsw-alias-state-business-tertiary: rgba(123, 155, 255, .18);
    --dsw-alias-border-l1: rgba(255, 255, 255, .14); --dsw-alias-card-fill: #24252a; --dsw-alias-card-fill-hover: #2f3036;
    --dsw-focus-ring-color: #7b9bff; --dsw-specific-menu: #2a2b30; --page: #18191c; color-scheme: dark;
  }
  body { margin: 0; font: 14px/22px -apple-system, BlinkMacSystemFont, sans-serif; background: var(--page); color: var(--dsw-alias-label-primary); }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: var(--page); border-bottom: .5px solid var(--dsw-alias-border-l1); }
  .bar-title { flex: 1 1 auto; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .play { height: 28px; padding: 0 10px; border-radius: 14px; border: .5px solid var(--dsw-alias-border-l1); background: transparent; color: inherit; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  const params = new URLSearchParams(location.search)
  if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
  window.__ModuleLoader__ = { load(entry) { window.__entry = entry } }
</script>
<script src="../lib/client.js"></script>
<script>
  const h = React.createElement
  const mod = window.__entry.factory(name => {
    if (name === 'react') return React
    if (name === 'react-dom') return ReactDOM
    throw new Error(name)
  })
  const { foldTodoEvent, createViewBuilder, historyNodeOf, planNodeOf } = mod.internals

  const t0 = Date.now() - 6 * 60_000
  const PLAN = { callId: 'p1', seq: 1, turn: 1, title: '계획 탭에 실시간 체크 넣기', markdown: [
    '# 계획 탭에 실시간 체크 넣기', '',
    '## 배경', '',
    '대화가 길어지면 **지금 어디까지 했는지** 보기 어렵습니다. 투영 `todos`는 다음 턴에 비워져서 목록이 사라집니다.', '',
    '> 할 일은 에이전트 것입니다. 탭에서 체크해도 DSH에 쓰지 않습니다.', '',
    '## 단계', '',
    '1. 할 일 기록 모으기', '   - `todo/write` 이벤트를 접어 턴별 묶음을 만든다', '   - 항목마다 시작·완료 시각을 남긴다',
    '2. 실시간 체크 화면 만들기', '3. 채팅 머리 진행 칩 만들기', '4. 화면 검수와 문서 정리', '',
    '## 파일', '',
    '| 파일 | 바꿀 것 |', '|---|---|',
    '| `src/todo-history.js` | 기록 접기, `deriveHistory` |', '| `src/client.template.js` | 탭·칩·창 |', '',
    '```js', "ctx.uiConversation.binding(sessionId).target('dsh-plan-view')", '```', '',
    '---', '',
    '자세한 규칙은 [DSH 문서](https://example.com/dsh)를 따릅니다.',
  ].join('\n') }
  const TODOS = ['할 일 기록 모으기', '실시간 체크 화면 만들기', '채팅 머리 진행 칩 만들기', '화면 검수와 문서 정리']
  const status = (step, i) => (i < step ? 'completed' : i === step ? 'in_progress' : 'pending')
  const turn = n => ({ kind: 'step', turn: { turn: n }, step: { step: 1 } })

  const empty = params.get('empty') === '1'
  let step = Math.min(Number(params.get('step') ?? 1), TODOS.length)
  const carried = params.get('carried') === '1'

  function eventsUpTo(last) {
    const matches = [
      // 계획(seq 1)보다 앞선 턴의 목록: 이 계획의 실행 기록으로 세지 않는다.
      { event: { type: 'todo/write', seq: 0, time: t0, data: { todos: [{ content: '구조 문서 읽기', status: 'completed' }, { content: '설치 확인', status: 'completed' }] } }, location: turn(1) },
    ]
    for (let s = 0; s <= last; s++) {
      matches.push({ event: { type: 'tool/call', seq: 10 + s * 2, data: { name: 'todo_write', callId: `c${s}`, arguments: '{}' } }, location: turn(2) })
      matches.push({ event: { type: 'todo/write', seq: 11 + s * 2, time: t0 + 60_000 + s * 70_000, data: { todos: TODOS.map((content, i) => ({ content, status: status(s, i) })) } }, location: turn(2) })
    }
    return matches
  }
  function snapshotAt(last) {
    if (empty) return createViewBuilder().empty
    const state = eventsUpTo(last).reduce((s, m) => foldTodoEvent(s, m), undefined)
    return createViewBuilder().replace({ nodes: [planNodeOf({ key: 'p1', id: 'p1', state: PLAN }), historyNodeOf({ key: 'h', id: 'history', state })] })
  }

  const listeners = new Set()
  let snapshot = snapshotAt(step)
  let running = step < TODOS.length
  const store = {
    getSnapshot: () => snapshot,
    subscribe: fn => { listeners.add(fn); return () => listeners.delete(fn) },
  }
  function setStep(next) {
    step = next
    snapshot = snapshotAt(step)
    running = step < TODOS.length
    listeners.forEach(fn => fn())
  }

  const slots = {}
  mod.apply({
    slots: { inject: (_n, fn) => fn(), register: (opts, Component) => { slots[opts.name] = { opts, Component } } },
    uiConversation: {
      events: { register: () => () => {} },
      views: { register: () => () => {} },
      binding: () => ({ target: () => store }),
    },
    effect: fn => fn(),
  })

  function props(slot) {
    const injected = slot.opts.inject('s1')
    return {
      usePlanState: select => select(React.useSyncExternalStore(injected.hooks.planState.subscribe, injected.hooks.planState.getSnapshot)),
      useSession: select => select({ running: React.useSyncExternalStore(store.subscribe, () => running) }),
      useProjection: key => {
        React.useSyncExternalStore(store.subscribe, () => step)
        if (key !== 'todos' || empty) return null
        return carried ? null : TODOS.map((content, i) => ({ content, status: status(step, i) }))
      },
      inspectCall: callId => alert(`실행 흐름에서 ${callId} 열기`),
    }
  }

  function App() {
    const view = slots['conversation.view']
    const chip = slots['conversation.session.header.utilities']
    const [playing, setPlaying] = React.useState(false)
    React.useEffect(() => {
      if (!playing) return undefined
      const timer = setInterval(() => setStep(step >= TODOS.length ? 0 : step + 1), 2000)
      return () => clearInterval(timer)
    }, [playing])
    return h(React.Fragment, null,
      h('div', { className: 'bar' },
        h('span', { className: 'bar-title' }, '계획 탭에 실시간 체크 넣기'),
        h('button', { type: 'button', className: 'play', 'aria-pressed': playing, onClick: () => setPlaying(p => !p) }, playing ? '재생 멈춤' : '실시간 재생'),
        h(chip.Component, props(chip))),
      h(view.Component, props(view)))
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
