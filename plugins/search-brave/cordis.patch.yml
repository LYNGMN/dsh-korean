# Brave Search bundle for DSH.
# It registers:
#   brave          - a web_search provider backed by the Brave Search API
#   brave_search   - a tool that searches on Brave directly
#   /brave <question> - a command that uses Brave for that one request
# The API key is not stored here: brave-search reads BRAVE_API_KEY from the
# DSH credential store, the launch environment, or ~/.dsh/brave-api-key.
- insert:
    - id: brave-search
      name: '@lyngmn/dsh-search-brave'
      config:
        apiKeyEnv: BRAVE_API_KEY
        apiKeyFile: "~/.dsh/brave-api-key"
        endpoint: https://api.search.brave.com/res/v1/web/search
        count: 8
        safeSearch: moderate
- id: web
  config:
    searchProvider: brave
    fetchProvider: http
