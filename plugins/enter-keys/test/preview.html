<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔터 키 설정 미리보기</title>
<!-- 실제 DSH 없이 lib/client.js의 설정 줄과 입력창 Enter 처리를 올려 보는 틀. ?theme=dark 어두운 테마.
     입력창은 DSH keymap.ts의 동작(조합 중·조합 끝 10ms 안 Enter 삼키기, Shift+Enter 줄바꿈)을 흉내 낸 가짜다. -->
<style>
  :root {
    --dsw-alias-label-primary: #1f1f1f; --dsw-alias-label-secondary: #5f5f5f; --dsw-alias-label-tertiary: #6b6b6b;
    --dsw-alias-border-l1: rgba(0, 0, 0, .12); --dsw-alias-border-l2: rgba(0, 0, 0, .08);
    --dsw-alias-bg-module-platform: #f0f1f3; --dsw-alias-bg-base: #fff; --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .04);
    --dsw-elevation-stroke-color: rgba(0, 0, 0, .12); --dsw-focus-ring-color: #3964fe; --dsw-focus-ring-width: 2px;
    --dsw-radius-md: 10px; --page: #fff; color-scheme: light;
  }
  :root[data-theme='dark'] {
    --dsw-alias-label-primary: #ececec; --dsw-alias-label-secondary: #b4b4b4; --dsw-alias-label-tertiary: #9a9a9a;
    --dsw-alias-border-l1: rgba(255, 255, 255, .14); --dsw-alias-border-l2: rgba(255, 255, 255, .1);
    --dsw-alias-bg-module-platform: #2a2b30; --dsw-alias-bg-base: #3a3b41; --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
    --dsw-elevation-stroke-color: rgba(255, 255, 255, .16); --dsw-focus-ring-color: #7b9bff; --page: #1b1c1f; color-scheme: dark;
  }
  body { margin: 0; font: 14px/22px -apple-system, BlinkMacSystemFont, sans-serif; background: var(--page); color: var(--dsw-alias-label-primary); }
  main { box-sizing: border-box; max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { margin: 8px 0 4px; font-size: 16px; line-height: 24px; font-weight: 600; }
  .section { display: flex; flex-direction: column; }
  .section > [data-slot] > :last-child { border-bottom: none; }
  .mock-row { display: flex; align-items: center; gap: 8px; padding: 16px 0; border-bottom: .5px solid var(--dsw-alias-border-l2); }
  .mock-row > div { flex: 1; min-width: 0; }
  .mock-row .t { font-size: 14px; line-height: 22px; }
  .mock-row .d { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); word-break: keep-all; }
  .mock-row button { height: 36px; padding: 0 14px; border: none; border-radius: 10px; background: var(--dsw-alias-bg-module-platform); color: inherit; font: inherit; white-space: nowrap; }
  [data-composer-card] { margin-top: 24px; border: .5px solid var(--dsw-alias-border-l1); border-radius: 16px; padding: 12px 14px; }
  [data-composer-input]:focus-visible, [data-composer-input]:focus { outline: 2px solid var(--dsw-focus-ring-color); outline-offset: 4px; border-radius: 4px; }
  [data-composer-input] { min-height: 44px; font-size: 16px; line-height: 24px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; }
  [data-composer-input]:empty::before { content: '메시지를 입력하세요'; color: var(--dsw-alias-label-tertiary); }
  #log { margin: 12px 0 0; padding: 0 0 0 20px; color: var(--dsw-alias-label-secondary); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>일반</h1>
  <div class="section">
    <div data-slot="settings.general.item">
      <div class="mock-row"><div><div class="t">작업 중 보내기 방식</div><div class="d">에이전트가 일하는 동안 Enter와 보내기 단추가 하는 일이에요. Cmd/Ctrl+Enter는 반대 방식을 써요.</div></div><button type="button" data-qa-ignore>대기열</button></div>
      <div id="row"></div>
    </div>
  </div>
  <div data-composer-card>
    <div data-composer-overlay><span id="overlay"></span></div>
    <div data-composer-input contenteditable="true" role="textbox" aria-multiline="true" aria-label="메시지"></div>
  </div>
  <ol id="log" aria-label="보낸 메시지"></ol>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
  window.__ModuleLoader__ = { load(entry) { window.__entry = entry } }
</script>
<script src="../lib/client.js"></script>
<script>
  const mod = window.__entry.factory(name => {
    if (name === 'react') return React
    throw new Error(name)
  })
  const found = {}
  mod.apply({
    effect: fn => { fn() },
    slots: { inject: (_n, fn) => fn(), register: (opts, C) => { found[opts.name] = C } },
  })
  ReactDOM.createRoot(document.getElementById('row')).render(React.createElement(found['settings.general.item']))
  ReactDOM.createRoot(document.getElementById('overlay')).render(React.createElement(found['conversation.input.overlay']))

  // 가짜 DSH 입력창: keymap.ts처럼 조합 중과 조합 끝 10ms 안의 Enter를 삼킨다.
  const input = document.querySelector('[data-composer-input]')
  const log = document.getElementById('log')
  let until = 0
  input.addEventListener('compositionend', () => { until = Date.now() + 10 })
  input.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return
    if (event.shiftKey) { event.preventDefault(); document.execCommand('insertLineBreak'); return }
    if (event.isComposing || event.keyCode === 229 || Date.now() < until) return
    event.preventDefault()
    if (event.repeat || input.textContent.trim() === '') return
    const li = document.createElement('li')
    li.textContent = (event.metaKey || event.ctrlKey ? '[반대 방식] ' : '') + input.innerText
    log.appendChild(li)
    input.textContent = ''
  })
</script>
</body>
</html>
