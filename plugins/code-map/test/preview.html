<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 지도 미리보기</title>
<!-- 실제 DSH 없이 lib/client.js의 코드 지도 탭을 올려 보는 틀.
     ?theme=dark 어두운 테마, ?state=ready|gaps|unknown|nochange|pending|indexing|off|missing 화면 상태(없으면 ready).
     브라우저 콘솔에서 window.__code = {…}로 바꾸면 2초 안에 화면이 따라 바뀐다(상태 전환 때 위치가 튀는지 잴 때). -->
<style>
  :root {
    --dsw-alias-label-primary: #1f1f1f; --dsw-alias-label-secondary: #5f5f5f;
    --dsw-alias-background-main: #fff; --dsw-alias-interactive-bg-hover: #f2f3f5; --dsw-alias-border-l3: #d9dde3;
    --page: #fafafa; color-scheme: light;
  }
  :root[data-theme='dark'] {
    --dsw-alias-label-primary: #ececec; --dsw-alias-label-secondary: #b4b4b4;
    --dsw-alias-background-main: #1d1e22; --dsw-alias-interactive-bg-hover: #2f3036; --dsw-alias-border-l3: #3c3e46;
    --page: #18191c; color-scheme: dark;
  }
  body { margin: 0; font: 14px/22px -apple-system, BlinkMacSystemFont, sans-serif; background: var(--page); color: var(--dsw-alias-label-primary); }
  .draft { display: flex; flex-direction: column; gap: 4px; max-width: 704px; margin: 0 auto; padding: 0 16px 24px; font-size: 12px; color: var(--dsw-alias-label-secondary); }
  .draft textarea { font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #767676; background: transparent; color: inherit; }
  html { scrollbar-width: thin; scrollbar-color: #8a8f98 transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  const params = new URLSearchParams(location.search)
  if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
  window.__ModuleLoader__ = { load(entry) { window.__entry = entry } }
  const base = { enabled: true, repo: 'DiscordActions', focus: [], indexedAt: Date.now() - 20000, indexMs: 400 }
  const clean = { notIndexed: 0, partial: 0, unusable: 0, skipped: 0, unknownFormats: [] }
  const rows = [
    { id: 'a', name: 'sendResume', file: 'src/services/resume/send-resume-with-a-very-long-file-name.js', line: 42, hop: 1 },
    { id: 'b', name: 'renderReceipt', file: 'src/views/receipt.js', line: 7, hop: 2 },
  ]
  const CODE = {
    ready: { ...base, state: 'ready', coverage: clean,
      requestImpact: { status: 'ready', files: ['src/cache.js', 'src/user.js', 'src/db.js'], candidates: rows },
      impact: { changed: 0, total: 0, files: [], candidates: [] } },
    gaps: { ...base, state: 'ready', partial: true,
      coverage: { notIndexed: 88, partial: 8, unusable: 2, skipped: 0, unknownFormats: [{ ext: '.gs', files: 28 }, { ext: '.xyz', files: 2 }, { ext: '.sh', files: 1 }, { ext: '.abc', files: 1 }] },
      requestImpact: { status: 'ready', files: ['src/cache.js', 'src/user.js', 'src/db.js'], candidates: rows },
      impact: { changed: 3, total: 2, files: ['src/cache.js'], candidates: rows } },
    unknown: { ...base, state: 'ready', coverage: { notIndexed: 1, partial: 0, unusable: 0, skipped: 0, unknownFormats: null },
      requestImpact: { status: 'ready', files: ['a.js'], candidates: [] } },
    nochange: { ...base, state: 'ready', coverage: clean, impact: { changed: 0, total: 0, files: [], candidates: [] } },
    pending: { ...base, state: 'ready', coverage: clean, requestImpact: { status: 'pending' } },
    indexing: { ...base, state: 'indexing', indexedAt: undefined, indexMs: undefined },
    off: { state: 'off', enabled: false, repo: 'DiscordActions', focus: [] },
    missing: { state: 'engine-missing', enabled: true, repo: 'DiscordActions', focus: [] },
  }
  window.__code = CODE[params.get('state') ?? 'ready']
  window.fetch = async (url, options) => {
    const body = options?.method === 'POST' ? JSON.parse(options.body) : null
    if (body?.action === 'search') return Response.json({ available: true, result: rows })
    if (body?.action === 'callers') return Response.json({ available: true, result: { total: 2, candidates: rows } })
    return Response.json(window.__code)
  }
</script>
<script src="../lib/client.js"></script>
<script>
  const h = React.createElement
  const mod = window.__entry.factory(name => {
    if (name === 'react') return React
    throw new Error(name)
  })
  const slots = {}
  mod.apply({
    slots: { inject: (_n, fn) => fn(), register: (opts, Component) => { slots[opts.name] = { opts, Component } } },
    effect: fn => fn(),
  })
  const props = {
    sessionId: 's1',
    useInput: select => select({ draft: '' }),
    inputActions: {
      captureInsertion: () => ({ start: 0, end: 0, draftRev: 0 }),
      insertText: text => { document.getElementById('draft').value += text; return true },
    },
  }
  function App() {
    const view = slots['conversation.view']
    return h(React.Fragment, null, h(view.Component, props),
      h('label', { className: 'draft' }, '가짜 입력창', h('textarea', { id: 'draft', rows: 2 })))
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
