# Search bundle for DSH (@lyngmn/dsh-search).
# It registers:
#   web_search providers  you, parallel, keenable, tavily, tinyfish, jina,
#                         firecrawl, naver, kakao, bing
#   auto                  a web_search provider that tries them in turn
#                         (in the order set on the plugin page: autoOrder)
#   engine_search           a tool that searches one engine, or "auto"
#   /search <engine> <question>
#                         a command that uses that engine for one request
# It does not pick web.searchProvider. Pick "auto" or a Search Fallback order
# such as "Exa → Brave → Auto" on the Web search settings page.
# Keys are entered on this plugin's page and kept in the DSH credential store;
# they are never stored here. Without a key, You.com, Parallel, Keenable,
# Tavily, Firecrawl and Bing use their keyless tier; TinyFish, Jina, Naver and
# Kakao are skipped.
- insert:
    - id: search
      name: '@lyngmn/dsh-search'
      config:
        providers: [you, parallel, keenable, tavily, tinyfish, jina, firecrawl, naver, kakao, bing]
        # Engines the automatic "auto" provider uses, in order. The plugin page
        # changes it (DSH keeps that change in the profile and applies it live).
        autoOrder: [you, parallel, keenable, tavily, tinyfish, jina, firecrawl, naver, kakao, bing]
        # Results per engine when the plugin page sets none. The page saves its
        # per-engine numbers as `counts` (for example naver: 30), each kept within
        # that engine's own maximum.
        count: 10
        timeoutMs: 20000
        # Bing market (mkt) and Accept-Language.
        bingMarket: ko-KR
        safeSearch: moderate
        # Credential names each engine looks up (Naver needs two).
        keys:
          you: YDC_API_KEY
          parallel: PARALLEL_API_KEY
          keenable: KEENABLE_API_KEY
          tavily: TAVILY_API_KEY
          tinyfish: TINYFISH_API_KEY
          jina: JINA_API_KEY
          firecrawl: FIRECRAWL_API_KEY
          naver: [NAVER_CLIENT_ID, NAVER_CLIENT_SECRET]
          kakao: KAKAO_REST_API_KEY
