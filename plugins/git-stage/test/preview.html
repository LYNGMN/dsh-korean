<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 단계 미리보기</title>
<!-- 실제 DSH 없이 lib/client.js의 작업 단계 탭과 채팅 머리 칩을 올려 보는 틀.
     ?theme=dark 어두운 테마, ?stage=0~6 단계 고정(0 원본 브랜치 … 6 모두 끝), ?blocked=gh GitHub 로그인 만료, ?repo=0 저장소 아님, ?fail=1 읽기 실패. -->
<style>
  :root {
    --dsw-alias-label-primary: #1f1f1f; --dsw-alias-label-secondary: #5f5f5f; --dsw-alias-label-tertiary: #8a8a8a;
    --dsw-alias-state-business-primary: #3964fe; --dsw-alias-state-business-tertiary: rgba(57, 100, 254, .12);
    --dsw-alias-state-warning-primary: #a35c00; --dsw-alias-state-danger-primary: #c9302c;
    --dsw-alias-border-l1: rgba(0, 0, 0, .12); --dsw-alias-card-fill: #fff; --dsw-alias-card-fill-hover: #f2f3f5;
    --dsw-focus-ring-color: #3964fe; --dsw-focus-ring-width: 2px; --dsw-radius-lg: 12px; --dsw-radius-sm: 6px;
    --dsw-specific-menu: #fff; --page: #fafafa; color-scheme: light;
  }
  :root[data-theme='dark'] {
    --dsw-alias-label-primary: #ececec; --dsw-alias-label-secondary: #b4b4b4; --dsw-alias-label-tertiary: #8d8d8d;
    --dsw-alias-state-business-primary: #7b9bff; --dsw-alias-state-business-tertiary: rgba(123, 155, 255, .18);
    --dsw-alias-state-warning-primary: #f0b45a; --dsw-alias-state-danger-primary: #ff7b72;
    --dsw-alias-border-l1: rgba(255, 255, 255, .14); --dsw-alias-card-fill: #24252a; --dsw-alias-card-fill-hover: #2f3036;
    --dsw-focus-ring-color: #7b9bff; --dsw-specific-menu: #2a2b30; --page: #18191c; color-scheme: dark;
  }
  body { margin: 0; font: 14px/22px -apple-system, BlinkMacSystemFont, sans-serif; background: var(--page); color: var(--dsw-alias-label-primary); }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: var(--page); border-bottom: .5px solid var(--dsw-alias-border-l1); }
  .bar-title { flex: 1 1 auto; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  const params = new URLSearchParams(location.search)
  if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
  window.__ModuleLoader__ = { load(entry) { window.__entry = entry } }

  const stage = Number(params.get('stage') ?? 3)
  const BRANCH = 'claude/feat/git-stage'
  const FACTS = [
    { branch: 'main', isBase: true, changes: 0, ahead: 0 },
    { changes: 4, ahead: 0 },
    { changes: 0, ahead: 2 },
    { changes: 0, ahead: 2 },
    { changes: 0, ahead: 3, upstream: `origin/${BRANCH}`, pr: { number: 14, state: 'OPEN', draft: true, url: null, mergeCommit: null } },
    { changes: 0, ahead: 3, upstream: `origin/${BRANCH}`, pr: { number: 14, state: 'MERGED', draft: false, url: null, mergeCommit: 'abc' } },
    { changes: 0, ahead: 3, upstream: `origin/${BRANCH}`, pr: { number: 14, state: 'MERGED', draft: false, url: null, mergeCommit: 'abc' }, tag: 'v1.1.0' },
  ]
  const facts = params.get('repo') === '0' ? { repo: false } : {
    repo: true, folder: 'dsh-korean', branch: BRANCH, base: 'main', isBase: false, upstream: null, unpushed: 0,
    hadCommits: true, headTime: 1, pr: null, prError: params.get('blocked') === 'gh' ? 'auth' : null, tag: null,
    ...FACTS[Math.min(Math.max(stage, 0), FACTS.length - 1)],
  }
  window.fetch = async () => (params.get('fail') === '1'
    ? new Response('{}', { status: 500 })
    : new Response(JSON.stringify({ facts }), { headers: { 'content-type': 'application/json' } }))
  window.__todos = stage >= 3
    ? [{ content: '단계 규칙 만들기', status: 'completed' }, { content: 'npm test로 검증하기', status: 'completed' }, { content: '검토 요청 열기', status: 'in_progress' }]
    : [{ content: '단계 규칙 만들기', status: stage >= 2 ? 'completed' : 'in_progress' }, { content: 'npm test로 검증하기', status: 'pending' }]
</script>
<script src="../lib/client.js"></script>
<script>
  const h = React.createElement
  const mod = window.__entry.factory(name => {
    if (name === 'react') return React
    if (name === 'react-dom') return ReactDOM
    throw new Error(name)
  })
  const slots = {}
  mod.apply({
    slots: { inject: (_n, fn) => fn(), register: (opts, Component) => { slots[opts.name] = { opts, Component } } },
    effect: fn => fn(),
  })
  const props = {
    sessionId: 's1',
    useSession: select => select({ running: false }),
    useProjection: key => (key === 'todos' ? window.__todos : undefined),
  }
  function App() {
    const view = slots['conversation.view']
    const chip = slots['conversation.session.header.utilities']
    return h(React.Fragment, null,
      h('div', { className: 'bar' },
        h('span', { className: 'bar-title' }, '작업 단계 보기 만들기'),
        h(chip.Component, props)),
      h(view.Component, props))
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
