<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 한국어 DSH 키트 로고. 사용자가 만든 고래 시안을 SVG 곡선으로 옮겼다(DeepSeek 로고를 옮긴 것이 아니다). 빨강·파랑은 시안의 태극 색. 움직임은 완성 그림에서 시작해 한 번, 4초에 끝난다. 움직임을 안 그리는 곳과 동작 줄이기 설정에서는 완성 그림이 보인다. -->
  <title>한국어 DSH 키트</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .swim { transform-origin: 64px 64px; animation: swim 2s cubic-bezier(.3, .6, .3, 1); }
      .bob { transform-origin: 64px 64px; animation: bob 2s ease-in-out 2s; }
      .tail { transform-origin: 99.6px 47.8px; animation: wag .6s ease-in-out .2s 6; }
      .fin { transform-origin: 54.4px 87.8px; animation: flap .75s ease-in-out .4s 4; }
      .wave { animation: wave 2s cubic-bezier(.2, .7, .3, 1); }
      .lid { transform-origin: 44.5px 62.6px; animation: blink .32s ease-in-out 3.5s; }
    }
    @keyframes swim {
      0% { transform: none; opacity: 1; animation-timing-function: ease-in; }
      9% { transform: scale(.94); opacity: 0; animation-timing-function: step-end; }
      10% { transform: translate(36px, 12px) rotate(12deg) scale(.5); opacity: 0; }
      32% { opacity: 1; }
      59% { transform: translate(9px, -6px) rotate(-7deg) scale(.86); }
      100% { transform: none; opacity: 1; }
    }
    @keyframes bob {
      0%, 100% { transform: none; }
      25% { transform: translateY(2.5px) rotate(2deg); }
      50% { transform: translateY(-2px) rotate(-1.5deg); }
      75% { transform: translateY(1px) rotate(.8deg); }
    }
    @keyframes wag { 0%, 100% { transform: none; } 30% { transform: rotate(-4deg); } 72% { transform: rotate(10deg); } }
    @keyframes flap { 0%, 100% { transform: none; } 50% { transform: rotate(6deg); } }
    @keyframes wave {
      0% { transform: none; opacity: 1; animation-timing-function: step-end; }
      10% { transform: translate(-9px, 7px); opacity: 0; animation-timing-function: step-end; }
      50% { transform: translate(-9px, 7px); opacity: 0; }
      100% { transform: none; opacity: 1; }
    }
    @keyframes blink { 0%, 100% { transform: scaleY(0); opacity: 1; } 50% { transform: scaleY(1); opacity: 1; } }
  </style>
